<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квиз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =============================================
   SCENARIO_URL — единственная строка для смены сценария
   ============================================= */
   
   /* =============================================
   Чтобы фон popupбыл прозрачный надо в настройках
   основной/вызывающей станирцы, созданной в Битрикс24.Сайты
   добавить пользоватьельский CSS 
    
    .fancybox-content,
    .fancybox-iframe {
      background: transparent !important;
    }
   ============================================= */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  scroll-behavior:smooth;
  min-height:100%;
  background:transparent !important;
}
:root{
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'Inter','Helvetica Neue',sans-serif;
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;
  --radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);

  --color-bg:#f7f6f2;
  --color-surface:#ffffff;
  --color-surface-2:#f3f0ec;
  --color-border:oklch(0.3 0.01 80 / 0.12);
  --color-text:#28251d;
  --color-text-muted:#7a7974;
  --color-text-faint:#bab9b4;
  --color-primary:#01696f;
  --color-primary-hover:#0c4e54;
  --color-primary-light:#cedcd8;
  --color-success:#437a22;
  --color-success-light:#d4dfcc;
  --color-warning:#000000;
  --color-warning-light:#4fd2c2;
  --color-error:#00acbc;
  --color-error-light:#e0ced7;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg:0 12px 32px oklch(0.2 0.01 80 / 0.12);
}

body{
  min-height:100dvh;
  min-height:100%;
  width:100%;
  margin:0;
  font-family:var(--font-body);
  font-size:var(--text-base);
  color:var(--color-text);
  background:transparent !important;
  display:flex;align-items:center;justify-content:center;
  padding:var(--space-4);
}
html{
  background:transparent !important;
}

/* CARD */
.quiz-card{
  width:100%;max-width:560px;
  background:var(--color-surface);
  border-radius:var(--radius-2xl);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  position:relative;
}

/* PROGRESS BAR */
.progress-wrap{
  height:4px;background:var(--color-surface-2);
  position:relative;overflow:hidden;
}
.progress-bar{
  height:100%;background:var(--color-primary);
  border-radius:var(--radius-full);
  transition:width 400ms cubic-bezier(0.16,1,0.3,1);
  width:0%;
}

/* SCREEN CONTAINER */
.screen{
  display:none;padding:var(--space-10) var(--space-8);
  animation:fadeIn 260ms ease both;
}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HERO SCREEN */
.hero-badge-row{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
  margin-bottom:var(--space-6);
}
.badge{
  font-size:var(--text-xs);font-weight:500;
  color:var(--color-primary);
  background:var(--color-primary-light);
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-full);
}
.hero-title{
  font-family:var(--font-display);
  font-size:var(--text-2xl);
  line-height:1.1;
  color:var(--color-text);
  margin-bottom:var(--space-4);
}
.hero-subtitle{
  font-size:var(--text-base);
  color:var(--color-text-muted);
  line-height:1.6;
  max-width:44ch;
  margin-bottom:var(--space-8);
}

/* QUESTION SCREEN */
.q-meta{
  font-size:var(--text-xs);font-weight:600;
  color:var(--color-text-muted);
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:var(--space-4);
}
.q-text{
  font-family:var(--font-display);
  font-size:var(--text-xl);
  line-height:1.2;
  margin-bottom:var(--space-2);
}
.q-hint{
  font-size:var(--text-xs);
  color:var(--color-text-faint);
  margin-bottom:var(--space-6);
}
.options-list{
  display:flex;flex-direction:column;gap:var(--space-2);
  margin-bottom:var(--space-8);
}
.option-btn{
  width:100%;text-align:left;
  padding:var(--space-4) var(--space-5);
  border-radius:var(--radius-lg);
  border:1.5px solid var(--color-border);
  background:var(--color-surface);
  font-size:var(--text-sm);font-weight:500;
  color:var(--color-text);
  cursor:pointer;
  transition:all var(--transition);
  line-height:1.4;
}
.option-btn:hover{
  border-color:var(--color-primary);
  background:color-mix(in oklch, var(--color-primary) 5%, var(--color-surface));
}
.option-btn.selected{
  border-color:var(--color-primary);
  background:var(--color-primary-light);
  color:var(--color-primary-hover);
}
.option-btn:active{transform:scale(0.985)}

/* NAV ROW */
.nav-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-4);
}
.btn-back{
  font-size:var(--text-sm);font-weight:500;
  color:var(--color-text-muted);
  display:flex;align-items:center;gap:var(--space-1);
  padding:var(--space-2) 0;
  background:none;border:none;cursor:pointer;
  transition:color var(--transition);
}
.btn-back:hover{color:var(--color-text)}
.btn-back svg{width:16px;height:16px}

/* PRIMARY BUTTON */
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--space-2);
  padding:var(--space-4) var(--space-8);
  border-radius:var(--radius-full);
  background:var(--color-primary);
  color:#fff;
  font-size:var(--text-sm);font-weight:600;
  border:none;cursor:pointer;
  transition:background var(--transition),transform var(--transition),box-shadow var(--transition);
  box-shadow:var(--shadow-sm);
  white-space:nowrap;
}
.btn-primary:hover{background:var(--color-primary-hover);box-shadow:var(--shadow-md)}
.btn-primary:active{transform:scale(0.96)}
.btn-primary:disabled{opacity:.45;pointer-events:none}

/* EMAIL SCREEN */
.email-icon{
  width:48px;height:48px;
  background:var(--color-primary-light);
  border-radius:var(--radius-xl);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--space-6);
}
.email-icon svg{width:24px;height:24px;color:var(--color-primary)}
.email-label{
  font-size:var(--text-sm);font-weight:500;
  color:var(--color-text-muted);
  display:block;margin-bottom:var(--space-2);
}
.email-input{
  width:100%;
  padding:var(--space-4) var(--space-5);
  border-radius:var(--radius-lg);
  border:1.5px solid var(--color-border);
  background:var(--color-surface);
  font-size:var(--text-base);
  color:var(--color-text);
  outline:none;
  transition:border-color var(--transition),box-shadow var(--transition);
  margin-bottom:var(--space-3);
}
.email-input:focus{
  border-color:var(--color-primary);
  box-shadow:0 0 0 3px color-mix(in oklch,var(--color-primary) 15%,transparent);
}
.email-input.error{border-color:var(--color-error)}
.email-error{
  font-size:var(--text-xs);
  color:var(--color-error);
  margin-bottom:var(--space-4);
  min-height:1.2em;
}
.consent-row{
  display:flex;align-items:flex-start;gap:var(--space-3);
  margin-bottom:var(--space-6);
  cursor:pointer;
}
.consent-check{
  width:18px;height:18px;flex-shrink:0;margin-top:2px;
  accent-color:var(--color-primary);cursor:pointer;
}
.consent-text{
  font-size:var(--text-xs);
  color:var(--color-text-muted);
  line-height:1.5;
}
.fear-callout{
  background:var(--color-warning-light);
  border-radius:var(--radius-lg);
  padding:var(--space-4) var(--space-5);
  font-size:var(--text-xs);
  color:var(--color-warning);
  line-height:1.5;
  margin-bottom:var(--space-6);
}

/* LOADING SCREEN */
.loading-wrap{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:var(--space-16) var(--space-8);
  text-align:center;gap:var(--space-6);
}
.spinner{
  width:44px;height:44px;
  border:3px solid var(--color-primary-light);
  border-top-color:var(--color-primary);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  font-size:var(--text-base);
  color:var(--color-text-muted);
}

/* RESULT SCREEN */
.result-badge{
  display:inline-flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-xs);font-weight:600;
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-full);
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:var(--space-5);
}
.result-badge.low{background:var(--color-success-light);color:var(--color-success)}
.result-badge.medium{background:var(--color-warning-light);color:var(--color-warning)}
.result-badge.high{background:var(--color-error-light);color:var(--color-error)}
.result-score{
  font-size:var(--text-xs);color:var(--color-text-faint);
  margin-bottom:var(--space-6);
}
.result-title{
  font-family:var(--font-display);
  font-size:var(--text-xl);line-height:1.2;
  margin-bottom:var(--space-4);
}
.result-text{
  font-size:var(--text-sm);
  color:var(--color-text-muted);
  line-height:1.7;max-width:46ch;
  margin-bottom:var(--space-6);
}
.result-flags{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
  margin-bottom:var(--space-6);
}
.flag-chip{
  font-size:var(--text-xs);font-weight:500;
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-full);
  background:var(--color-warning-light);
  color:var(--color-warning);
}
.result-cta-row{
  display:flex;flex-wrap:wrap;gap:var(--space-3);
  margin-bottom:var(--space-6);
}
.btn-secondary{
  padding:var(--space-3) var(--space-6);
  border-radius:var(--radius-full);
  border:1.5px solid var(--color-border);
  background:transparent;
  font-size:var(--text-sm);font-weight:500;
  color:var(--color-text);cursor:pointer;
  transition:all var(--transition);
}
.btn-secondary:hover{border-color:var(--color-primary);color:var(--color-primary)}
.crm-status{
  font-size:var(--text-xs);
  color:var(--color-text-faint);
  padding-top:var(--space-4);
  border-top:1px solid var(--color-border);
}
.crm-status.ok{color:var(--color-success)}
.crm-status.err{color:var(--color-error)}

@media(max-width:480px){
  .screen{padding:var(--space-8) var(--space-6)}
  .hero-title{font-size:clamp(1.6rem,7vw,2rem)}
  .result-cta-row{flex-direction:column}
  .btn-primary,.btn-secondary{width:100%;text-align:center}
}
</style>
</head>
<body>

<main class="quiz-card" role="main">
  <div class="progress-wrap" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- HERO -->
  <section class="screen active" id="screen-hero" aria-label="Начало квиза"></section>

  <!-- QUESTION (dynamically populated) -->
  <section class="screen" id="screen-question" aria-label="Вопрос квиза"></section>

  <!-- EMAIL -->
  <section class="screen" id="screen-email" aria-label="Ввод email">
    <div class="email-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    </div>
    <h2 id="email-title" style="font-family:var(--font-display);font-size:var(--text-xl);margin-bottom:var(--space-3)"></h2>
    <p id="email-subtitle" style="font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.6;margin-bottom:var(--space-6)"></p>
    <div id="email-fear" class="fear-callout" style="display:none"></div>
    <label class="email-label" for="emailInput">Email</label>
    <input id="emailInput" class="email-input" type="email" placeholder="you@example.com" autocomplete="email">
    <p class="email-error" id="emailError" role="alert"></p>
    <label class="consent-row">
      <input type="checkbox" class="consent-check" id="consentCheck">
      <span class="consent-text">Я согласен(а) с политикой обработки персональных данных</span>
    </label>
    <div class="nav-row">
      <button class="btn-back" onclick="goBack()" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Назад
      </button>
      <button class="btn-primary" id="btnEmail" onclick="submitEmail()">Получить результат</button>
    </div>
  </section>

  <!-- LOADING -->
  <section class="screen" id="screen-loading" aria-label="Загрузка">
    <div class="loading-wrap">
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text" id="loadingText">Анализируем ваши ответы…</p>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result" aria-label="Результат"></section>
</main>

<script>
/* ==============================================
   ПОДДЕРЖКА СМЕНЫ СЦЕНАРИЯ
   ============================================== */
const DEFAULT_SCENARIO_URL = "./scenarios/pain-v1.json";
const SCENARIO_QUERY_KEY = "quiz";
const SKIP_COVER_QUERY_KEY = "skip_cover";

function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name) || "";
}

function isTruthyParam(value) {
  return /^(?:1|true|yes|on)$/i.test(value.trim());
}

function resolveScenarioUrl() {
  const rawValue = getQueryParam(SCENARIO_QUERY_KEY).trim();
  if (!rawValue) return DEFAULT_SCENARIO_URL;
  if (rawValue.includes("..")) return DEFAULT_SCENARIO_URL;

  const safeValue = rawValue.replace(/[^a-zA-Z0-9_.\-\/]/g, "");
  if (!safeValue) return DEFAULT_SCENARIO_URL;

  if (safeValue.endsWith(".json")) {
    return safeValue.startsWith("./") || safeValue.startsWith("/") || safeValue.includes("/")
      ? safeValue
      : `./scenarios/${safeValue}`;
  }

  return `./scenarios/${safeValue}.json`;
}

const SCENARIO_URL = resolveScenarioUrl();
console.log("[QUIZ] Scenario URL:", SCENARIO_URL);

/* ===================== STATE ===================== */
let scenario = null;
let state = { step: 0, answers: {}, email: "" };
let currentOptions = [];

/* ===================== INIT ===================== */
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const res = await fetch(SCENARIO_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    scenario = await res.json();
    
    // Проверка режима редактирования
    const editMode = getQueryParam("edit");
    if (isTruthyParam(editMode)) {
      // Сохранить JSON в sessionStorage и редирект на редактор
      sessionStorage.setItem("quiz_editor_load", JSON.stringify(scenario));
      const quizName = getQueryParam(SCENARIO_QUERY_KEY) || "new";
      window.location.href = `./quiz-editor/?load=${encodeURIComponent(quizName)}&edit=Y`;
      return;
    }
    
    buildHero();
    if (isTruthyParam(getQueryParam(SKIP_COVER_QUERY_KEY))) {
      startQuiz();
    }
    console.log("[QUIZ] Scenario loaded:", SCENARIO_URL);
  } catch (e) {
    console.error("[QUIZ] Failed to load scenario:", e);
    document.querySelector(".quiz-card").innerHTML =
      '<div style="padding:2rem;color:#a12c7b;font-family:sans-serif">⚠️ Не удалось загрузить сценарий квиза.<br><small>' + e.message + '</small></div>';
  }
});

/* ===================== HERO ===================== */
function buildHero() {
  const m = scenario.meta;
  const badges = (m.trust_badges || []).map(b => `<span class="badge">${b}</span>`).join("");
  document.getElementById("screen-hero").innerHTML = `
    <div class="hero-badge-row">${badges}</div>
    <h1 class="hero-title">${m.title}</h1>
    <p class="hero-subtitle">${m.subtitle}</p>
    <button class="btn-primary" onclick="startQuiz()" style="width:100%;">${m.cta_start}</button>
  `;
}

/* ===================== FLOW ===================== */
function startQuiz() {
  trackEvent("start_quiz");
  state.step = 0;
  state.answers = {};
  showQuestion(0);
}

function showQuestion(idx) {
  const q = scenario.questions[idx];
  const total = scenario.questions.length;
  setProgress(((idx) / (total + 1)) * 100);

  currentOptions = q.options;
  const selected = state.answers[q.id];

  const optionsHTML = q.options.map((opt, i) => `
    <button
      class="option-btn${selected === opt.value ? " selected" : ""}"
      onclick="selectOption('${q.id}', '${opt.value}', ${i})"
      data-value="${opt.value}"
      aria-pressed="${selected === opt.value}"
    >${opt.label}</button>
  `).join("");

  const backBtn = idx > 0
    ? `<button class="btn-back" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>← Назад</button>`
    : `<span></span>`;

  document.getElementById("screen-question").innerHTML = `
    <p class="q-meta">Вопрос ${idx + 1} из ${total}</p>
    <h2 class="q-text">${q.text}</h2>
    <p class="q-hint">Выберите один вариант</p>
    <div class="options-list" role="group" aria-label="${q.text}">${optionsHTML}</div>
    <div class="nav-row">
      ${backBtn}
      <button class="btn-primary" id="btnNext" onclick="nextStep()" ${selected ? "" : "disabled"}>
        ${idx < total - 1 ? "Далее" : "Продолжить"}
      </button>
    </div>
  `;

  showScreen("screen-question");
}

function selectOption(qId, value, i) {
  state.answers[qId] = value;
  trackEvent("answer_question", { question: qId, value });

  document.querySelectorAll(".option-btn").forEach(b => {
    b.classList.toggle("selected", b.dataset.value === value);
    b.setAttribute("aria-pressed", b.dataset.value === value);
  });
  const btnNext = document.getElementById("btnNext");
  if (btnNext) btnNext.disabled = false;
}

function nextStep() {
  const idx = state.step;
  const total = scenario.questions.length;
  if (idx < total - 1) {
    state.step++;
    showQuestion(state.step);
  } else {
    showEmailScreen();
  }
}

function goBack() {
  const cur = document.querySelector(".screen.active").id;
  if (cur === "screen-email") {
    state.step = scenario.questions.length - 1;
    showQuestion(state.step);
  } else if (cur === "screen-question" && state.step > 0) {
    state.step--;
    showQuestion(state.step);
  } else {
    showScreen("screen-hero");
    setProgress(0);
  }
}

/* ===================== EMAIL ===================== */
function showEmailScreen() {
  const m = scenario.meta;
  document.getElementById("email-title").textContent = m.email_title || "Мы почти готовы показать результат";
  document.getElementById("email-subtitle").textContent = m.email_subtitle || "Оставьте email, чтобы получить результат и рекомендации и не потерять их";
  const fearEl = document.getElementById("email-fear");
  if (m.email_fear) { fearEl.textContent = m.email_fear; fearEl.style.display = "block"; }
  document.getElementById("emailError").textContent = "";
  document.getElementById("emailInput").classList.remove("error");
  setProgress(((scenario.questions.length) / (scenario.questions.length + 1)) * 100);
  showScreen("screen-email");
}

function submitEmail() {
  const val = document.getElementById("emailInput").value.trim();
  const consent = document.getElementById("consentCheck").checked;

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
    document.getElementById("emailInput").classList.add("error");
    document.getElementById("emailError").textContent = "Введите корректный email";
    return;
  }
  if (!consent) {
    document.getElementById("emailError").textContent = "Необходимо согласие на обработку данных";
    return;
  }

  state.email = val;
  trackEvent("submit_email");
  showScreen("screen-loading");
  setProgress(95);

  setTimeout(() => {
    const result = calcResult();
    sendToCRM(result).then(() => showResult(result));
  }, 900);
}

/* ===================== SCORING ===================== */
function calcResult() {
  const qs = scenario.questions;
  let score = 0;
  const crm_answers = {};
  let isChronic = false;
  let failedTreatment = false;

  qs.forEach(q => {
    const val = state.answers[q.id];
    const opt = q.options.find(o => o.value === val);
    if (opt) score += opt.score;
    crm_answers[q.id] = val;

    if (q.flag === "chronic_if_gte_index") {
      const idx = q.options.findIndex(o => o.value === val);
      if (idx >= q.chronic_threshold) isChronic = true;
    }
    if (q.flag === "failed_treatment_if_value" && val === q.failed_treatment_value) {
      failedTreatment = true;
    }
  });

  const sc = scenario.scoring;
  let category = "high";
  if (score <= sc.low.max) category = "low";
  else if (score <= sc.medium.max) category = "medium";

  return { score, category, isChronic, failedTreatment, crm_answers };
}

/* ===================== RESULT ===================== */
function showResult(r) {
  setProgress(100);
  const s = scenario.scoring[r.category];
  const labels = { low: "Низкий риск", medium: "Средний риск", high: "Высокий риск" };

  const flags = [];
  if (r.isChronic) flags.push("⚠️ Возможна хроническая боль");
  if (r.failedTreatment) flags.push("⚠️ Лечение не помогло");

  const flagsHTML = flags.length
    ? `<div class="result-flags">${flags.map(f => `<span class="flag-chip">${f}</span>`).join("")}</div>`
    : "";

  const ctaHTML = (s.cta || []).map((c, i) => {
    const text = typeof c === 'string' ? c : c.text;
    const url = (typeof c === 'object' && c.url) ? c.url : '#';
    return i === 0
      ? `<button class="btn-primary" onclick="window.location.href='${url}'">${text}</button>`
      : `<button class="btn-secondary" onclick="window.location.href='${url}'">${text}</button>`;
  }).join("");

  document.getElementById("screen-result").innerHTML = `
    <span class="result-badge ${r.category}">${labels[r.category]}</span>
    <p class="result-score">Ваш результат: ${r.score} балл${r.score === 1 ? "" : r.score < 5 ? "а" : "ов"}</p>
    <h2 class="result-title">${s.title}</h2>
    <p class="result-text">${s.text}</p>
    ${flagsHTML}
    <div class="result-cta-row">${ctaHTML}</div>
    <p class="crm-status" id="crmStatus">Отправляем данные…</p>
  `;

  showScreen("screen-result");
  trackEvent("finish_quiz", { score: r.score, category: r.category });
}

/* ===================== CRM ===================== */
async function sendToCRM(r) {
  const f = scenario.crm_fields;
  const source = scenario.meta.source_label || "quiz";

  const fields = {
    TITLE: source,
    EMAIL: [{ VALUE: state.email, VALUE_TYPE: "WORK" }],
    SOURCE_ID: "WEB",
    SOURCE_DESCRIPTION: source,
  };

  scenario.questions.forEach(q => {
    if (q.crm_field) fields[q.crm_field] = r.crm_answers[q.id] || "";
  });

  if (f.score)            fields[f.score]            = r.score;
  if (f.result)           fields[f.result]           = r.category;
  if (f.is_chronic)       fields[f.is_chronic]       = r.isChronic ? "Y" : "N";
  if (f.failed_treatment) fields[f.failed_treatment] = r.failedTreatment ? "Y" : "N";
  if (f.source)           fields[f.source]           = source;
  if (f.quiz_date)        fields[f.quiz_date]        = new Date().toISOString();

  console.log("[QUIZ] Payload (to proxy):", JSON.stringify({ fields }, null, 2));

  try {
    const resp = await fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields })
    });
    const data = await resp.json();
    console.log('[QUIZ] Proxy response:', JSON.stringify(data));

    const el = document.getElementById('crmStatus');
    if (el) {
      if (data.result) {
        el.textContent = 'Лид создан. ID: ' + data.result;
        el.className = 'crm-status ok';
      } else if (data.error) {
        el.textContent = 'Ошибка CRM: ' + JSON.stringify(data.error_description || data.error);
        el.className = 'crm-status err';
      } else {
        el.textContent = 'Неизвестный ответ от сервера';
        el.className = 'crm-status err';
      }
    }
  } catch (e) {
    console.error('[QUIZ] Proxy fetch error:', e);
    const el = document.getElementById('crmStatus');
    if (el) { el.textContent = 'Ошибка сети: ' + e.message; el.className = 'crm-status err'; }
  }
}

/* ===================== HELPERS ===================== */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setProgress(pct) {
  document.getElementById("progressBar").style.width = pct + "%";
}

function trackEvent(name, data = {}) {
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: name, ...data });
  console.log("[QUIZ] Event:", name, data);
}
