<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, sans-serif;
      background: #f7f6f2;
      color: #28251d;
      text-align: center;
      padding: 2rem;
    }
    .page {
      max-width: 720px;
    }
    code {
      display: block;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border: 1px solid #d6d3ce;
      border-radius: 0.75rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Страница не найдена</h1>
    <p>Если вы попали сюда по адресу <code id="path"></code>, происходит перенаправление.</p>
    <p id="message">Пожалуйста, подождите...</p>
  </main>
  <script>
    const path = window.location.pathname;
    document.getElementById('path').textContent = path + window.location.search;

    const isConfirm = path.replace(/\/$/, '') === '/confirm';
    if (isConfirm) {
      const redirectUrl = '/confirm/' + window.location.search;
      document.getElementById('message').textContent = 'Перенаправляем на ' + redirectUrl;
      window.location.replace(redirectUrl);
    } else {
      document.getElementById('message').textContent = 'Запрошенный путь не найден.';
    }
  </script>
</body>
</html>
