<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, sans-serif;
      background: #f7f6f2;
      color: #28251d;
      text-align: center;
      padding: 2rem;
    }
    .page {
      width: min(100%, 640px);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 72px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: clamp(2rem, 2.5vw, 3rem);
    }
    p {
      margin: 0.75rem 0;
      line-height: 1.7;
    }
    code {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.35rem 0.5rem;
      background: #f7f7f5;
      border: 1px solid #d6d3de;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      color: #111;
    }
    .status-block {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
      align-items: center;
    }
    .spinner {
      width: 64px;
      height: 64px;
      margin: 0 auto;
      border: 6px solid rgba(1, 105, 111, 0.15);
      border-top-color: #01696f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .status-heading {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1a1a1a;
    }
    .status-text {
      color: #5d5d5d;
      font-size: 0.98rem;
      display: none;
    }
    .status-text.error {
      color: #b00020;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Confirm</h1>
    <div class="status-block">
      <div class="spinner" id="status-spinner"></div>
      <div class="status-heading" id="status-heading">Выполняем подтверждение...</div>
      <div class="status-text" id="status-message" style="display:none;"></div>
      <div class="status-text" id="status-subtext" style="display:none;"></div>
    </div>
  </main>
  <script src="/confirm.js"></script>
</body>
</html>
